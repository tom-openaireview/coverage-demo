name: Sample coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_UPLOAD_TOKEN: ${{ secrets.COVERAGE_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run tests and generate fresh LCOV
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-include=demo.mjs
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          demo.test.mjs
      - name: Upload sample coverage
        if: env.COVERAGE_UPLOAD_TOKEN != ''
        uses: 9to5/9to5-coverage-action@v1
        with:
          token: ${{ secrets.COVERAGE_UPLOAD_TOKEN }}
          path: lcov.info
